name: Build FilmX APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: 📁 Collect APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/FilmX-v1.0.apk || cp android/app/build/outputs/apk/*/*/*.apk build-output/FilmX-v1.0.apk
          ls -lh build-output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmX-Release-APK
          path: build-output/FilmX-v1.0.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.6.0
          name: "FilmX Android APK v1.6.0 — Jonli Avto-Yangilanish (In-App OTA Sync), 60FPS & Qotmasdan Ishlash"
          body: |
            ## 🎬 FilmX Mobile v1.6.0 (Yangi Nashr)
            O'zbek tilidagi barcha tarjima kinolar, seriallar va yangi premyeralar portali!

            ### 🚀 v1.6.0 Yangiliklari:
            - 🔄 **Jonli Avtomatik Yangilanish (In-App OTA Data Sync)**: Saytga yangi kino yoki serial qo'shilganda, ilova fon rejimida avtomatik ravishda yangilanadi. Foydalanuvchidan hech qanday APK ni qayta o'rnatish so'ralmaydi!
            - ⚡ **Qayta O'rnatish (PackageInstaller) Muammosi Butunlay Yo'qotildi**: Yangi filmlar chiqqanda majburiy APK yuklab olib ustiga o'rnatish oynasi olib tashlandi.
            - 🎯 **60FPS Tezkor va Ravon Ishlash**: Katalogdagi 1,480+ kinolar va 5,000+ qismlar bir zumda ochiladi, lag va qotishlar to'liq bartaraf etildi.
            - 🔄 **Pull-to-Refresh**: Bosh sahifa va Katalogda ekranni pastga tortish orqali yangi kinolarni tekshirish va yangilash imkoniyati.
            - 📥 **Kinolarni Yuklab Olish (Galereyaga & Serverga)**: Telefon xotirasiga yoki shaxsiy ro'yxatga saqlab oflayn tomosha qilish.

            📥 **O'rnatish uchun pastdagi `FilmX-v1.0.apk` faylini yuklab oling!**
          files: build-output/FilmX-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
