name: Build FilmX APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: 📁 Collect APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/FilmX-v1.0.apk || cp android/app/build/outputs/apk/*/*/*.apk build-output/FilmX-v1.0.apk
          ls -lh build-output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmX-Release-APK
          path: build-output/FilmX-v1.0.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.7.1
          name: "FilmX Android APK v1.7.1 — 60FPS Ultra Tezkorlik, 0ms Cold-Start & Optimallashtirilgan Katalog"
          make_latest: true
          body: |
            ## 🎬 FilmX Mobile v1.7.1 (Yangi Optimallashtirilgan Nashr)
            O'zbek tilidagi barcha tarjima kinolar, seriallar va yangi premyeralar portali!

            ### 🚀 v1.7.1 Yangiliklari:
            - ⚡ **0ms Cold-Start (Bir zumda ochilish)**: Boshlang'ich og'ir ma'lumotlar lazy rejimga o'tkazilib, ilova ochilishidagi qotish butunlay yo'qotildi.
            - 🎯 **60FPS Ravon Katalog va Qidiruv**: Qidiruv maydonida harflar yozganda klaviatura fokusining yo'qolishi to'liq bartaraf etildi.
            - 🌐 **Barqaror Tarmoq Ulanishi**: Soxta "Internet uzildi" ogohlantirishlari yo'qotildi.
            - 🖼️ **Rasmlar Uchun Avtomatik Zaxira**: Rasm yuklanmay qolsa, chiroyli placeholder ko'rsatiladi.
            - 🔄 **Jonli Avtomatik Yangilanish (In-App OTA Data Sync)**: Saytga yangi kino yoki serial qo'shilganda fon rejimida yangilanadi.

            📥 **O'rnatish uchun pastdagi `FilmX-v1.0.apk` faylini yuklab oling!**
          files: build-output/FilmX-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
